<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AuraCinema — movie discovery and personalised recommendations." />
    <!-- Colour of the mobile browser bar; matches --color-bg in src/styles/tokens.css. -->
    <meta name="theme-color" content="#121212" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Fonts from Google Fonts (decision recorded in the UI/UX specification).
      Inter: interface text. Playfair Display: editorial headings.
      "preconnect" opens the connection early so the fonts arrive sooner, and
      "display=swap" shows a system font until the web font has loaded.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap"
    />

    <title>AuraCinema</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
